<script>
  function toggleWhyBreakdown(e) {
    e.stopPropagation();
    const content = document.getElementById('breakdown-content');
    const chevron = document.getElementById('breakdown-chevron');
    if (!content || !chevron) return;
    
    if (content.classList.contains('hidden')) {
      content.classList.remove('hidden');
      chevron.classList.add('rotate-180');
    } else {
      content.classList.add('hidden');
      chevron.classList.remove('rotate-180');
    }
  }

  const cards = document.querySelectorAll('.route-card');
  const pathA = document.getElementById('route-a-path');
  const pathB = document.getElementById('route-b-path');
  const pathC = document.getElementById('route-c-path');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('ring-2', 'ring-primary'));
      card.classList.add('ring-2', 'ring-primary');

      const route = card.getAttribute('data-route');
      if (route === 'A') {
        if(pathA) pathA.setAttribute('stroke-width', '6');
        if(pathB) pathB.setAttribute('stroke-width', '3');
        if(pathC) pathC.setAttribute('stroke-width', '3');
      } else if (route === 'B') {
        if(pathA) pathA.setAttribute('stroke-width', '3');
        if(pathB) pathB.setAttribute('stroke-width', '6');
        if(pathC) pathC.setAttribute('stroke-width', '3');
      } else {
        if(pathA) pathA.setAttribute('stroke-width', '3');
        if(pathB) pathB.setAttribute('stroke-width', '3');
        if(pathC) pathC.setAttribute('stroke-width', '6');
      }
    });
  });

  const swapBtn = document.getElementById('swap-route-btn');
  if (swapBtn) {
    swapBtn.addEventListener('click', () => {
      const icon = swapBtn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.classList.toggle('rotate-180');
      }
    });
  }
</script></main>
